name: E2E Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

jobs:
  playwright:
    name: Playwright e2e
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: tradeflow
          POSTGRES_PASSWORD: tradeflow
          POSTGRES_DB: tradeflow_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://tradeflow:tradeflow@localhost:5432/tradeflow_e2e
      SESSION_SECRET: ci-e2e-session-secret
      NODE_ENV: development
      E2E_BASE_URL: http://localhost:5000
      PORT: "5000"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Install Playwright browsers and OS deps
        run: npx playwright install --with-deps chromium

      - name: Wait for Postgres
        run: |
          for i in {1..30}; do
            if pg_isready -h localhost -p 5432 -U tradeflow; then
              echo "Postgres is ready"
              exit 0
            fi
            sleep 2
          done
          echo "Postgres did not become ready in time" >&2
          exit 1

      - name: Apply database schema
        run: npm run db:push -- --force

      - name: Start dev server
        run: |
          mkdir -p .ci-logs
          nohup npm run dev > .ci-logs/dev-server.log 2>&1 &
          echo $! > .ci-logs/dev-server.pid

      - name: Wait for dev server to respond
        run: |
          for i in {1..60}; do
            code=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:5000/api/auth/me || echo "000")
            if [ "$code" != "000" ] && [ "$code" != "502" ] && [ "$code" != "503" ]; then
              echo "Dev server is up (status $code)"
              exit 0
            fi
            sleep 2
          done
          echo "Dev server did not start in time" >&2
          tail -n 200 .ci-logs/dev-server.log >&2 || true
          exit 1

      - name: Run Playwright e2e tests
        run: npm run test:e2e

      - name: Stop dev server
        if: always()
        run: |
          if [ -f .ci-logs/dev-server.pid ]; then
            kill "$(cat .ci-logs/dev-server.pid)" 2>/dev/null || true
          fi

      - name: Upload dev server logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dev-server-log
          path: .ci-logs/dev-server.log
          if-no-files-found: ignore

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
