name: Dark Mode Background Check

on:
  push:
    branches: [main]
    paths:
      - "client/src/**"
  pull_request:
    branches: [main]
    paths:
      - "client/src/**"
  workflow_dispatch:

jobs:
  check:
    name: No bare dark:bg-gray-9xx classes
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check for bare dark:bg-gray-9xx classes
        run: bash scripts/check-dark-bg.sh
